[project]
name = "cte2dbt"
version = "1.0.5"
description = "Tools with batteries included to extract CTE from a large SQL query and split them iteratively into dbt models."
readme = "README.md"
requires-python = ">=3.11"
license = "EUPL-1.2"
license-files = ["LICENSE"]
authors = [
    { name = "piotr-yuxuan", email = "piotr-yuxuan@users.noreply.github.com" }
]
keywords = ["sql", "sqlglot", "data", "dbt", "models", "cte"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Libraries",
    "Topic :: Database",
    "Typing :: Typed",
]
dependencies = ["sqlglot>=30.0,<31"]

[project.urls]
Repository = "https://github.com/piotr-yuxuan/cte2dbt"

[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"

[dependency-groups]
test = ["pytest>=9.1.1,<10"]
dev = [{ include-group = "test" }]

[tool.ruff]
line-length = 100
extend-exclude = [".worktrees"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812", # Conflicts with the formatter.
    "CPY001", # There is no licence-header policy: LICENSE covers the repository.
]

[tool.ruff.lint.per-file-ignores]
# Asserts are the test idiom; expectations are literal; test functions need no docstring; the
# test modules sit in a rootdir without __init__.py.
"tests/**" = ["S101", "PLR2004", "D1", "INP001"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src", "tests"]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib", "--strict-markers", "--strict-config", "-ra"]
filterwarnings = ["error"]
testpaths = ["tests"]
