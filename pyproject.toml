[project]
name = "cte2dbt"
version = "2.0.0"
description = "Split SQL views into dbt models, one per common table expression."
readme = "README.md"
requires-python = ">=3.11"
license = "EUPL-1.2"
license-files = ["LICENSE"]
authors = [
    { name = "piotr-yuxuan", email = "piotr-yuxuan@users.noreply.github.com" }
]
keywords = ["sql", "sqlglot", "dbt", "cte", "views", "t-sql", "azure-sql"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Database",
    "Topic :: Software Development :: Code Generators",
    "Typing :: Typed",
]
dependencies = ["sqlglot>=30.19,<31"]

[project.scripts]
cte2dbt = "cte2dbt.cli:main"

[project.urls]
Repository = "https://github.com/piotr-yuxuan/cte2dbt"
Documentation = "https://github.com/piotr-yuxuan/cte2dbt/blob/main/docs/README.md"
Issues = "https://github.com/piotr-yuxuan/cte2dbt/issues"
"Release notes" = "https://github.com/piotr-yuxuan/cte2dbt/blob/main/docs/reference/release-notes.md"

[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"

[dependency-groups]
test = [
    # No CPython 3.15 wheel yet: the execution tests skip there, never in check.py.
    "duckdb>=1.5.6,<2; python_version < '3.15'",
    "hypothesis>=6.170.1,<7",
    "jinja2>=3.1.6,<4",
    "pytest>=9.1.1,<10",
]
dev = [
    { include-group = "test" },
    "import-linter>=2.15,<3",
    "mypy>=2.4.0,<3",
    "pip-audit>=2.10.1,<3",
    "pytest-cov>=7.1.0,<8",
    "ruff==0.17.1",
    "sybil>=10.1.0,<11",
    # The build backend, so that the dependency audit covers it.
    "uv-build>=0.13.1,<0.14",
    "vulture>=2.16,<3",
    "zizmor>=1.31.1,<2",
]

[tool.ruff]
line-length = 100
extend-exclude = [".worktrees"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812", # Conflicts with the formatter.
    "CPY001", # There is no licence-header policy: LICENSE covers the repository.
]

[tool.ruff.lint.per-file-ignores]
# Asserts are the test idiom; expectations are literal; test functions need no docstring; the
# test modules sit in a rootdir without __init__.py; the SQL they build from their own constants
# runs on in-memory DuckDB, and the Jinja they render is SQL, not HTML; the command line
# runs in a child process with fixed arguments.
"tests/**" = ["S101", "PLR2004", "D1", "INP001", "S608", "S701", "S603"]
# Standard output and standard error are the interface of the command line.
"src/cte2dbt/cli.py" = ["T201"]
# Standalone scripts, not a package, that print their progress and run fixed tool commands;
# the XML they parse is written by the same run's pytest and coverage, and the only URLs they
# open are the http(s) links of the repository's own Markdown.
"dev/scripts/**" = ["INP001", "T201", "S603", "S607", "S314", "S310"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src", "tests", "dev/scripts"]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib", "--strict-markers", "--strict-config", "-ra"]
filterwarnings = ["error"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["cte2dbt"]
data_file = "dev/reports/.coverage"

[tool.coverage.report]
fail_under = 80
show_missing = true
precision = 2

[tool.coverage.xml]
output = "dev/reports/coverage.xml"

[tool.importlinter]
root_package = "cte2dbt"

[[tool.importlinter.contracts]]
name = "The command line sits above the pure conversion core"
type = "layers"
layers = ["cte2dbt.cli", "cte2dbt.core"]
