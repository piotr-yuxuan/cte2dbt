version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Europe/London
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7 # Let a compromised release be found before it is proposed.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Europe/London
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7 # Let a compromised release be found before it is proposed.
  - package-ecosystem: docker-compose
    directories: [/dev/resources/ci]
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Europe/London
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7 # Let a compromised release be found before it is proposed.
# No automatic merging. Raising the sqlglot cap is a deliberate change, after the
# compatibility job passes on the new major version.
